<html>
    <head>
        <title>Fractal Overdrive</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script type="module" src="./wasm-demo.js" ></script>
    </head>
    <body>

        <div class="fractal-overdrive">
            <canvas width="100" height="100"></canvas>
            <form id="form-rerender" action="." autocomplete="off" class="parameters">
                <h2>Target area</h2><p><label>Center X (numerator):</label><input id="input-x" name="x" type="number" value="0"> <label>Center Y (numerator):</label><input id="input-y" name="y" type="number" value="0"> <label>Window size (numerator)</label><input id="input-window" name="window" type="number" value="4"> <label>Scale (denominator):</label><input id="input-scale" name="scale" type="number" value="1"> </p><h2>Rendering settings</h2>
                <p><label>Resolution (pixels):</label><input id="input-res" name="res" type="number" value="512"> <label>Max iterations:</label><input id="input-iterations" name="input-iterations" type="number" value="16"> <br></p><input id="input-go" text="Go" type="submit"></form>
            <form>

            </form>
        </div>

    </body>
</html>
