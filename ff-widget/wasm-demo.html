<html>
    <head>
        <title>Fractal Overdrive</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script type="module" src="./wasm-demo.js" ></script>
<style>

        body{
            display: flex;
        }
        fractal-overdrive {
            max-width: 50%;

            margin: 2em;
        }
        </style>
    </head>
    <body>
        <template id="fractal-overdrive-tmpl">
            <style>@import "./fractal-overdrive-widget.css"</style>
            <input type="button" id="up" class="direction" value="&uparrow;"></input>
            <input type="button" id="left" class="direction"  value="&larr;"></input>
            <canvas width="100" height="100"> </canvas>
            <input type="button" id="right" class="direction"  value="&rarr;"></input>
            <input type="button" id="out" class="direction"  value="-"></input>
            <input type="button" id="down" class="direction"  value="&downarrow;"></input>
            <input type="button" id="in" class="direction"  value="+"></input>
            <div id="controls">
                <span id="status" class="loader"></span>
                <input type="button" id="reset" value="Reset" />
                <input type="button" id="update" value="Render" />
            </div>
            <div id="select-inputs">
                <select id="input-fractal" name="input-fractal" >
                    <option name="mandelbrot" id="mandelbrot" value="mandelbrot">Mandelbrot</option>
                    <option name="newton" id="newton" value="newton">Newton</option>
                </select>
                <select id="input-numeric" name="input-numeric" >
                    <option name="f32" value="f32"></option>
                </select>
            </div>

            <div id="numerators">
                ((<input type="text" id="input-x" class="number" ></input>, <input type="text" id="input-y" class="number" ></input>)
                &PlusMinus;
                <input type="text" id="input-window" class="number" ></input>))
            </div>
            <div id="denominators">
                &div;
                <input type="text" id="input-scale" class="number" ></input>
            </div>
            <div id="meta-numbers">
                <input type="text"  id="input-resolution" class="number" name="input-resolution" ></input>
                <label for="resolution">pixels</label>, 
                <input type="text"  id="input-iterations" class="number" name="input-iterations" type="number" ></input> <label for="input-iterations">iterations</label>
            </div>
        </template>

        <fractal-overdrive 
            name="mandelbrot-teaser"
            fractal="mandelbrot"
            x="304924415867450"
            y="115639204659165"
            window="16067102519808"
            scale="803355125990400"
            resolution="512"
            iterations="128"
            numeric="MaskedFloat<3,50>"
            original="./duck.webp"
        >
        </fractal-overdrive>
        <fractal-overdrive name="newton-default" fractal="newton">
        </fractal-overdrive>
    </body>
</html>
